<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#f7f7f7"/><rect x="40" y="35" width="1320" height="830" rx="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="80" y="90" font-family="Arial" font-size="30" font-weight="700" text-anchor="start" fill="#111">Wireframe 06 — Ayuda y procedencia</text><text x="80" y="135" font-family="Arial" font-size="20" font-weight="700" text-anchor="start" fill="#111">Dashboard de ocupación hospitalaria</text><text x="80" y="165" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Consulta por sala y estado de cama</text><rect x="80" y="195" width="330" height="58" rx="10" fill="#fff" stroke="#555" stroke-width="2"/><text x="94" y="230.0" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Sala: Todas</text><rect x="430" y="195" width="330" height="58" rx="10" fill="#fff" stroke="#555" stroke-width="2"/><text x="444" y="230.0" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Estado: Todos</text><rect x="790" y="197" width="160" height="52" rx="10" fill="#111" stroke="#111" stroke-width="2"/><text x="870.0" y="231" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Consultar</text><rect x="970" y="197" width="180" height="52" rx="10" fill="#fff" stroke="#111" stroke-width="2"/><text x="1060.0" y="231" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#111">Limpiar filtros</text><text x="1180" y="232" font-family="Arial" font-size="17" font-weight="700" text-anchor="start" fill="#111">? Ayuda</text><rect x="820" y="285" width="500" height="470" rx="10" fill="#fafafa" stroke="#555" stroke-width="2"/><text x="855" y="330" font-family="Arial" font-size="24" font-weight="700" text-anchor="start" fill="#111">Ayuda contextual</text><text x="855" y="375" font-family="Arial" font-size="18" font-weight="700" text-anchor="start" fill="#111">OCCUPIED</text><text x="855" y="405" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Cama actualmente ocupada.</text><text x="855" y="450" font-family="Arial" font-size="18" font-weight="700" text-anchor="start" fill="#111">AVAILABLE</text><text x="855" y="480" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Cama disponible según el estado registrado.</text><text x="855" y="525" font-family="Arial" font-size="18" font-weight="700" text-anchor="start" fill="#111">MAINTENANCE</text><text x="855" y="555" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Cama temporalmente fuera de disponibilidad.</text><text x="855" y="600" font-family="Arial" font-size="18" font-weight="700" text-anchor="start" fill="#111">% de ocupación</text><text x="855" y="630" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Camas ocupadas / total considerado.</text><text x="855" y="675" font-family="Arial" font-size="18" font-weight="700" text-anchor="start" fill="#111">Procedencia</text><text x="855" y="705" font-family="Arial" font-size="16" font-weight="400" text-anchor="start" fill="#111">Sistema Hospitalario Integrado — registro de camas.</text><rect x="80" y="310" width="680" height="260" rx="10" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/><text x="420" y="375" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#111">Protección de datos</text><text x="120" y="420" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" fill="#111">• El Dashboard muestra información agregada.</text><text x="120" y="460" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" fill="#111">• No requiere nombre, diagnóstico ni expediente del paciente.</text><text x="120" y="500" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" fill="#111">• Los permisos se validan en backend.</text></svg>