<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#f7f7f7"/><rect x="40" y="35" width="1320" height="830" rx="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="80" y="90" font-family="Arial" font-size="30" font-weight="700" text-anchor="start" fill="#111">Wireframe 04 — Sin resultados</text><text x="80" y="135" font-family="Arial" font-size="20" font-weight="700" text-anchor="start" fill="#111">Dashboard de ocupación hospitalaria</text><text x="80" y="165" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Consulta por sala y estado de cama</text><rect x="80" y="195" width="330" height="58" rx="10" fill="#fff" stroke="#555" stroke-width="2"/><text x="94" y="230.0" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Sala: Todas</text><rect x="430" y="195" width="330" height="58" rx="10" fill="#fff" stroke="#555" stroke-width="2"/><text x="444" y="230.0" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#111">Estado: Todos</text><rect x="790" y="197" width="160" height="52" rx="10" fill="#111" stroke="#111" stroke-width="2"/><text x="870.0" y="231" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Consultar</text><rect x="970" y="197" width="180" height="52" rx="10" fill="#fff" stroke="#111" stroke-width="2"/><text x="1060.0" y="231" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#111">Limpiar filtros</text><text x="1180" y="232" font-family="Arial" font-size="17" font-weight="700" text-anchor="start" fill="#111">? Ayuda</text><rect x="80" y="300" width="1240" height="250" rx="10" fill="#fafafa" stroke="#555" stroke-width="2"/><text x="700" y="375" font-family="Arial" font-size="26" font-weight="700" text-anchor="middle" fill="#111">No se encontraron camas con los filtros seleccionados.</text><text x="700" y="420" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" fill="#111">Cambie los filtros o límpielos para realizar una nueva consulta.</text><rect x="485" y="470" width="190" height="52" rx="10" fill="#fff" stroke="#111" stroke-width="2"/><text x="580.0" y="504" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#111">Limpiar filtros</text><rect x="700" y="470" width="220" height="52" rx="10" fill="#111" stroke="#111" stroke-width="2"/><text x="810.0" y="504" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Modificar filtros</text><text x="80" y="610" font-family="Arial" font-size="21" font-weight="700" text-anchor="start" fill="#111">Anotaciones UX</text><text x="100" y="650" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" fill="#111">1. Un resultado vacío no se presenta como error técnico.</text><text x="100" y="685" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" fill="#111">2. Se conservan los filtros para entender el contexto.</text><text x="100" y="720" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" fill="#111">3. Se ofrecen acciones claras para continuar.</text></svg>